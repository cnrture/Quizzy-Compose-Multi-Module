appId: com.canerture.quizappcompose
tags:
  - smoke
name: "Home — screen renders after login"
---
- runFlow:
    file: ../_shared/login.yaml
- assertVisible:
    id: "home.toolbar"
- assertVisible:
    id: "home.searchBar"
- assertVisible:
    id: "home.categoriesTitle"
# Popular quizzes load from the network and may lag slightly behind categories.
- extendedWaitUntil:
    visible:
      id: "home.popularQuizzesTitle"
    timeout: 20000
- assertVisible:
    id: "home.popularQuizzesTitle"
