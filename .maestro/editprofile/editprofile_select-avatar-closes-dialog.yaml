appId: com.canerture.quizappcompose
tags:
  - regression
name: "EditProfile — selecting an avatar closes the dialog"
---
- runFlow:
    file: ../_shared/login.yaml
- tapOn:
    id: "bottomBar.tab.ProfileScreen"
- extendedWaitUntil:
    visible:
      id: "profile.editProfileButton"
    timeout: 10000
- tapOn:
    id: "profile.editProfileButton"
- extendedWaitUntil:
    visible:
      id: "editProfile.changeAvatarButton"
    timeout: 10000
- tapOn:
    id: "editProfile.changeAvatarButton"
# Avatars load async from GetAvatarsUseCase — wait for the first grid item.
- extendedWaitUntil:
    visible:
      id: "editProfile.avatarsDialog.avatarItem0"
    timeout: 15000
# OnAvatarSelected -> dialog dismisses (isAvatarsDialogVisible = false).
- tapOn:
    id: "editProfile.avatarsDialog.avatarItem0"
- assertNotVisible:
    id: "editProfile.avatarsDialog.title"
