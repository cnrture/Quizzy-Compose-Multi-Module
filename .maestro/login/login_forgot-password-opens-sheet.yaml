appId: com.canerture.quizappcompose
tags:
  - regression
name: "Login — 'Forgot password' opens the reset bottom sheet"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome.emailButton"
    timeout: 20000
- tapOn:
    id: "welcome.emailButton"
- extendedWaitUntil:
    visible:
      id: "login.forgotPasswordText"
    timeout: 10000
- tapOn:
    id: "login.forgotPasswordText"
# Bottom sheet content (ForgotPasswordContent) becomes visible.
- extendedWaitUntil:
    visible:
      id: "login.forgotPassword.emailField"
    timeout: 10000
- assertVisible:
    id: "login.forgotPassword.sendButton"
