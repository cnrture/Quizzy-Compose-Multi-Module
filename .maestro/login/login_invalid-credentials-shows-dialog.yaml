appId: com.canerture.quizappcompose
tags:
  - regression
name: "Login — invalid credentials show the error dialog"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome.emailButton"
    timeout: 20000
- tapOn:
    id: "welcome.emailButton"
- extendedWaitUntil:
    visible:
      id: "login.emailField"
    timeout: 10000
- tapOn:
    id: "login.emailField"
- inputText: "nobody@example.com"
- tapOn:
    id: "login.passwordField"
- inputText: "wrongpassword123"
- tapOn:
    id: "login.loginButton"
# Firebase rejects → the ViewModel sets dialogState → QuizzyDialog(testTag = login.dialog)
# renders, and core:ui derives login.dialog.message / login.dialog.button.
- extendedWaitUntil:
    visible:
      id: "login.dialog.message"
    timeout: 15000
- assertVisible:
    id: "login.dialog.button"
# Dismiss and confirm the dialog goes away.
- tapOn:
    id: "login.dialog.button"
- assertNotVisible:
    id: "login.dialog.message"
