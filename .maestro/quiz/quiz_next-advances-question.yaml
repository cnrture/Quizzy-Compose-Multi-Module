appId: com.canerture.quizappcompose
tags:
  - regression
name: "Quiz — Next after answering advances to the following question"
---
- runFlow:
    file: ../_shared/login.yaml
# Popular quizzes are the last section on Home and load from the network, so the
# first item can sit below the fold. Scroll it into view before tapping.
- scrollUntilVisible:
    element:
      id: "home.popularQuizItem.nameText"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "home.popularQuizItem.nameText"
- extendedWaitUntil:
    visible:
      id: "detail.startQuizButton"
    timeout: 15000
- tapOn:
    id: "detail.startQuizButton"
- extendedWaitUntil:
    visible:
      id: "quiz.questionText"
    timeout: 15000
# Answer the first question so Next becomes enabled.
- tapOn:
    id: "quiz.answerOption"
- tapOn:
    id: "quiz.nextButton"
# handleNextClick loads the next question (quizNumber increments). Only the
# FIRST Next is exercised here — we never run the whole quiz to Summary.
- extendedWaitUntil:
    visible:
      id: "quiz.questionText"
    timeout: 10000
- assertVisible:
    id: "quiz.questionCountProgress"
- assertVisible:
    id: "quiz.answerOption"
