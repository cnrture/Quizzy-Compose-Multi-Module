appId: com.canerture.quizappcompose
tags:
  - regression
name: "Quiz — toolbar back returns to the Detail screen"
---
- runFlow:
    file: ../_shared/login.yaml
# Popular quizzes are the last section on Home and load from the network, so the
# first item can sit below the fold. Scroll it into view before tapping.
- scrollUntilVisible:
    element:
      id: "home.popularQuizItem.nameText"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "home.popularQuizItem.nameText"
- extendedWaitUntil:
    visible:
      id: "detail.startQuizButton"
    timeout: 15000
- tapOn:
    id: "detail.startQuizButton"
- extendedWaitUntil:
    visible:
      id: "quiz.questionText"
    timeout: 15000
# OnBackClick emits NavigateBack -> popBackStack() to Detail.
- tapOn:
    id: "quiz.toolbar.back"
- extendedWaitUntil:
    visible:
      id: "detail.startQuizButton"
    timeout: 10000
- assertVisible:
    id: "detail.startQuizButton"
- assertNotVisible:
    id: "quiz.questionText"
