# Detekt config — only rules that DIFFER from the 1.23.8 default are listed here.
# The build uses buildUponDefaultConfig = true, so every omitted rule/field falls back
# to detekt's default (identical behaviour). allRules = true is also on, which means an
# explicit `active: false` on a rule that is active-by-default MUST stay — deleting it would
# turn the rule on (and autoCorrect = true could then rewrite code). Kept blocks below are
# exactly those whose behaviour departs from the default.

# --- Report output: differs from default (custom exclude lists) ---
console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FileBasedFindingsReport'
    - 'LiteFindingsReport'

output-reports:
  active: true
  exclude:
    [ 'TxtOutputReport', 'XmlOutputReport', 'HtmlOutputReport' ]

complexity:
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']            # default: no Composable exemption
  LongMethod:
    threshold: 80                              # default: 60
    ignoreAnnotated: [ 'Composable' ]
  LongParameterList:
    active: false                              # default: true (keep off)
    ignoreAnnotated: [ 'Composable' ]
  TooManyFunctions:
    active: false                              # default: true (keep off)

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true                     # default: false

exceptions:
  TooGenericExceptionCaught:
    active: false                              # default: true (keep off)
  SwallowedException:
    active: false                              # default: true (keep off)

naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]          # default: no Composable exemption
  VariableNaming:
    excludes: [ '**/test/**', '**/androidTest/**', '**/theme/**' ]  # default: no theme exemption
  # active-by-default in 1.23.8; kept off here on purpose.
  InvalidPackageDeclaration:
    active: false
  MatchingDeclarationName:
    active: false
  NoNameShadowing:
    active: false

potential-bugs:
  # All active-by-default in 1.23.8; kept off here on purpose.
  AvoidReferentialEquality:
    active: false
  DoubleMutabilityForCollection:
    active: false
  HasPlatformType:
    active: false
  ImplicitDefaultLocale:
    active: false
  UnreachableCatchBlock:
    active: false
  UnusedUnaryOperator:
    active: false
  UselessPostfixExpression:
    active: false

style:
  MagicNumber:
    active: false                              # default: true (keep off)
    ignoreEnums: true                          # default: false
    ignoreAnnotated: [ 'MigrationQualifier', 'Composable' ]
  MaxLineLength:
    ignoreAnnotated: [ 'Composable' ]          # default: no Composable exemption
  ReturnCount:
    max: 3                                      # default: 2
  UnnecessaryAbstractClass:
    active: false                              # default: true (keep off)
  UnusedPrivateClass:
    excludes: [ "**theme/**" ]                 # default: no theme exemption
  UnusedPrivateMember:
    allowedNames: '(_|ignored|expected|serialVersionUID)'
    ignoreAnnotated: [ 'Composable' ]
  # active-by-default in 1.23.8; kept off here on purpose.
  DestructuringDeclarationWithTooManyEntries:
    active: false
  ExplicitItLambdaParameter:
    active: false
  ForbiddenVoid:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  NewLineAtEndOfFile:
    active: false
  ObjectLiteralToLambda:
    active: false
  UseArrayLiteralsInAnnotations:
    active: false
  UseCheckNotNull:
    active: false
  UseCheckOrError:
    active: false
  UseIsNullOrEmpty:
    active: false
  UseRequire:
    active: false
  UseRequireNotNull:
    active: false
  WildcardImport:
    active: false                              # default: true (keep off)

# --- Formatting (detekt-formatting / ktlint) ---
# These are NOT in default-detekt-config.yml (the formatting plugin has its own defaults),
# so buildUponDefaultConfig does not cover them. Kept as-is; the explicit active: false
# entries suppress rules that allRules would otherwise turn on.
formatting:
  FinalNewline:
    active: false
    autoCorrect: false
    insertFinalNewLine: false
  NoWildcardImports:
    active: false
    packagesToUseImportOnDemandProperty: 'java.util.*,kotlinx.android.synthetic.**'
  MaximumLineLength:
    active: true
    maxLineLength: 120
    ignoreBackTickedIdentifier: false
  Indentation:
    active: false
    autoCorrect: false
    indentSize: 4
